header:
  frame_id: map

# Four known static super-ellipsoid obstacles.  Geometry uses physical semi-axes;
# safety_margin expands only the IFDS planning envelope.
obstacles:
  - name: obstacle_1
    center: [20.0, 0.0, 4.0]
    axes: [2.0, 2.0, 4.0]
    exponents: [1.0, 1.0, 1.0]
    safety_margin: 1.0

  - name: obstacle_2
