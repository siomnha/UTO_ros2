    axes: [3.0, 3.0, 3.0]
    exponents: [1.0, 1.0, 1.0]
    safety_margin: 1.0

  - name: obstacle_3
    center: [50.0, 5.0, 7.0]
    axes: [3.0, 2.0, 4.0]
    exponents: [1.0, 1.0, 1.0]
