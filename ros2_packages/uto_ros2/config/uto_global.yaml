uto_planner:
  ros__parameters:
    use_sim_time: true

    # ROS interfaces and frames
    belief_topic: /Odometry
    path_topic: /ifds/local_path
    path_status_topic: /ifds/path_status
    mission_goal_topic: /ifds/mission_goal
    velocity_topic: /uto/velocity
    px4_velocity_topic: /fmu/out/vehicle_odometry
    px4_state_topic: /uto/px4_status
    trajectory_topic: /uto/trajectory
    execution_command_topic: /uto/execution_command
    diagnostics_topic: /uto/diagnostics
    resume_service: /uto/resume
    planning_frame: map
    velocity_source: patched_odometry_twist
    velocity_frame_alignment_mode: identity
    velocity_frame_yaw_offset: 0.0
    px4_velocity_time_mode: offset

    # Mode and one-shot behaviour
    mode: global
    planner_mode: uto
    global_one_shot: true
    global_replan_enabled: false
    delay_compensation_enabled: false

    # Full mission reference sampled independently from the 10 LGR nodes.
    lookahead_count: 20
    lookahead_spacing: 2.0
    horizon: 10.0
    terminal_goal_match_tolerance: 0.10

    # Preflight solve and post-solve commit
    global_commit_lead_time: 0.10
    global_preflight_retry_enabled: true
    global_preflight_max_attempts: 3
    global_preflight_retry_period: 0.5
    commit_check_rate: 50.0
    allowed_commit_lateness: 0.04

    # NLP startup-only dimensions
    regions: 2
    lgr_nodes_per_region: 5
    sigma_count: 7
    control_check_points_per_region: 31

    # Solver
    solver_max_iterations: 900
    solver_tolerance: 2.0e-5

    # Terminal constraints
    terminal_position_tolerance: 0.30
    terminal_velocity_tolerance: 0.03
    terminal_roll_pitch_tolerance: 0.05

    # Control, state, and normalization
    velocity_max: 4.0
    angle_max: 0.6
    control_min: [0.0, -0.48, -0.48, -1.2]
    control_max: [18.0, 0.48, 0.48, 1.2]
    state_scale: [3.0, 1.0, 1.2, 4.0, 4.0, 4.0, 0.6, 0.6, 0.6]
    control_scale: [9.81, 0.48, 0.48, 1.2]

    # Dense feasibility and path gates
    # Experimental simple-world setting: retain all LGR/non-dense gates but skip RK4 rollout.
    enable_dense_rollout_gate: false
    gate_dense_points_per_region: 15
    gate_rollout_endpoint_position_tolerance: 0.30
    gate_rollout_endpoint_velocity_tolerance: 0.50
    gate_rollout_endpoint_attitude_tolerance: 0.20
    path_tube_radius: 0.50
    sigma_path_tube_radius: 0.70

    # Commit continuity against the latest hold belief
    commit_position_tolerance: 0.15
    commit_velocity_tolerance: 0.20
    commit_attitude_tolerance: 0.10

    # Belief stability and covariance handling
    stable_samples: 5
    covariance_eigen_floor: 1.0e-9
    covariance_inflation: 1.2
    position_covariance_trace_max: 0.20
    attitude_covariance_trace_max: 0.05
    mean_delta_max: 0.30
    covariance_delta_max: 0.10

    # Objective
    weights: [1.0, 10.0, 10.0, 0.007, 1.0e-6, 1.0e-6]

    # Goal and dwell
    goal_position_tolerance: 0.20
    goal_velocity_tolerance: 0.20
    goal_yaw_enabled: true
    goal_yaw_tolerance: 0.20
    goal_dwell_time: 1.0

    # Freshness, pairing, and clocks
    belief_timeout: 0.30
    velocity_timeout: 0.30
    path_timeout: 30.0
    path_pair_timeout: 0.20
    path_generation_resolution: 0.05
    mission_goal_timeout: 0.0
    source_clock_tolerance: 0.50

    # Online-compatible delay parameters retained but unused when
    # delay_compensation_enabled=false.
    initial_delay: 0.50
    cold_start_delay: 1.20
    delay_p90_window: 20
    delay_p90_min_samples: 5
    minimum_delay: 0.20
    maximum_delay: 1.50
    validation_time: 0.02
    commit_margin: 0.08
    commit_scheduling_margin: 0.02
    latency_clip_min: 0.05
    latency_clip_max: 1.50
    commit_guard: 0.05
    process_noise_diagonal: [0.01, 0.01, 0.01, 0.02, 0.02, 0.02, 0.001, 0.001, 0.001]

    # Scheduler retained for startup/retry polling; no in-flight replanning.
    replan_rate: 0.75
