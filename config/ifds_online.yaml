ifds_planner:
  ros__parameters:
    use_sim_time: true
    planner_only: true
    frame_id: map
    gnss_denied: true
    gnss_odom_topic: /x500/gnss/odometry
    fast_lio_odom_topic: /Odometry
    goal_topic: /ifds/goal
    mission_goal_topic: /ifds/mission_goal
    path_topic: /ifds/local_path
    path_status_topic: /ifds/path_status
    obstacle_updates_topic: /ifds/obstacles
    planning_rate_hz: 2.0
    path_validity_duration: 0.8
    tf_timeout: 0.1
    allow_empty_obstacles: false
    validate_world_consistency: true
    world_sdf: ''
    path_geometry_change_threshold: 0.05
    path_resample_spacing: 0.10
    rho0: 2.5
    sigma0: 0.01
    cruise_speed: 2.0
    dt: 0.1
    max_iterations: 1000
    target_threshold: 0.05
    delta_g: 2.0
    alpha_deg: 0.0
    shape_following: false
    min_gamma: 1.02
    dynamic_obstacles: true
    velocity_mode: normal
    optimizer_mode: 0
    local_optimizer_period_steps: 5
    wall_modulation_gain: 1.5
    wall_influence_distance: 1.0
