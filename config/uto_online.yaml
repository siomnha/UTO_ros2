uto_planner:
  ros__parameters:
    use_sim_time: true
    belief_topic: /Odometry
    velocity_source: px4_vehicle_odometry
    path_topic: /ifds/local_path
    trajectory_topic: /uto/trajectory
    diagnostics_topic: /uto/diagnostics
    planning_frame: map
    mode: online
    horizon: 3.0
    lookahead_count: 10
    lookahead_spacing: 0.4
    replan_rate: 1.5
    belief_timeout: 0.30
    path_timeout: 0.8
    stable_samples: 5
    covariance_eigen_floor: 1.0e-9
    covariance_inflation: 1.2
    position_covariance_trace_max: 0.20
    attitude_covariance_trace_max: 0.05
    mean_delta_max: 0.30
    covariance_delta_max: 0.10
    regions: 2
    lgr_nodes_per_region: 5
    sigma_count: 7
    path_tube_radius: 0.6
    initial_delay: 0.5
    delay_p90_window: 20
    commit_margin: 0.08
    commit_guard: 0.05
    terminal_velocity_tolerance: 0.05
    process_noise_diagonal: [0.01,0.01,0.01,0.02,0.02,0.02,0.001,0.001,0.001]
    state_scale: [3.0,1.0,1.2,4.0,4.0,4.0,0.6,0.6,0.6]
    control_scale: [9.81,0.48,0.48,1.2]
    weights: [2.0,10.0,0.007,10.0,1.0e-6,1.0e-6]
    solver_tolerance: 2.0e-5
    solver_max_iterations: 500
    fallback_behavior: safe_hold
