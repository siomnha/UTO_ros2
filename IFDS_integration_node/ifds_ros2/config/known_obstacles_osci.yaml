header:
  frame_id: map

# Same four known obstacles as known_obstacles.yaml.  Only obstacles 2 and 3
# oscillate laterally along map Y; obstacles 1 and 4 remain static.
obstacles:
  - name: obstacle_1
    center: [20.0, 0.0, 4.0]
    axes: [2.0, 2.0, 4.0]
    exponents: [1.0, 1.0, 1.0]
    safety_margin: 1.0

  - name: obstacle_2
    center: [35.0, -5.0, 6.0]
    axes: [3.0, 3.0, 3.0]
    exponents: [1.0, 1.0, 1.0]
    safety_margin: 1.0
    dynamic: true
    motion:
      # y(t) = -5 + 4 sin(0.25 t)
      type: circular_y
      radius: 4.0
      radius_z: 0.0
      angular_speed: 0.25
      phase: 0.0

  - name: obstacle_3
    center: [50.0, 5.0, 7.0]
    axes: [3.0, 2.0, 4.0]
    exponents: [1.0, 1.0, 1.0]
    safety_margin: 1.0
    dynamic: true
    motion:
      # y(t) = 5 + 5 sin(0.20 t + pi/2)
      type: circular_y
      radius: 5.0
      radius_z: 0.0
      angular_speed: 0.20
      phase: 1.57079632679

  - name: obstacle_4
    center: [65.0, 0.0, 6.0]
    axes: [2.5, 2.5, 5.0]
    exponents: [1.0, 1.0, 1.0]
    safety_margin: 1.0
